<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>통통볼 챌린지</title>
  <meta name="description" content="별을 모두 모으면 클리어! 통통 튀는 공으로 10개의 스테이지에 도전하세요." />
  <meta name="theme-color" content="#2b3a67" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <!-- 메뉴 화면 -->
    <section id="menu" class="screen active">
      <div class="title">
        <div class="logo-ball"></div>
        <h1>통통볼 챌린지</h1>
        <p>별을 모두 모으면 클리어! 1단계는 가장 쉽고 10단계는 가장 어렵습니다.</p>
      </div>
      <div id="stageGrid" class="stage-grid"></div>
      <div class="menu-foot">
        <span id="progressText"></span>
        <button id="soundBtn" class="chip">🔊 소리 켜짐</button>
        <button id="resetProgress" class="chip ghost">기록 초기화</button>
      </div>
      <div class="howto">
        <b>조작</b> ← → 또는 A D 로 이동 · R 다시하기 · Esc 메뉴 · 휴대폰은 화면 아래 버튼
      </div>
    </section>

    <!-- 게임 화면 -->
    <section id="play" class="screen">
      <div class="hud">
        <button id="backBtn" class="chip" title="메뉴 (Esc)">☰</button>
        <div class="hud-stage"><b id="hudStage">1</b><span id="hudName"></span></div>
        <div class="hud-stats">
          <span>⭐ <b id="hudStars">0/0</b></span>
          <span>⏱ <b id="hudTime">0.0</b></span>
          <span>💥 <b id="hudDeaths">0</b></span>
        </div>
        <button id="retryBtn" class="chip" title="다시하기 (R)">↻</button>
      </div>
      <div class="board">
        <canvas id="game" width="640" height="416"></canvas>
        <div id="tip" class="tip"></div>
      </div>
      <div class="pad">
        <button id="padL" aria-label="왼쪽">◀</button>
        <button id="padR" aria-label="오른쪽">▶</button>
      </div>
    </section>
  </div>

  <div id="modal" class="modal hidden">
    <div class="modal-box">
      <div class="modal-stars">⭐</div>
      <h2 id="modalTitle">클리어!</h2>
      <p id="modalBody"></p>
      <div class="modal-actions" id="modalActions"></div>
    </div>
  </div>

  <script src="engine.js"></script>
  <script src="levels.js"></script>
  <script src="game.js"></script>
</body>
</html>
